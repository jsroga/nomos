_version = 1

[workflow]
graph = "workflow.fabro"

# Run (module is parameterized — override per module):
#   fabro run .fabro/workflows/plan/workflow.toml
#   fabro run .fabro/workflows/plan/workflow.toml -I module=chat
#   fabro run .fabro/workflows/plan/workflow.toml --goal "…custom goal…"
[run]
goal = "Clean up and align the {{ inputs.module }} module (src/domains/{{ inputs.module }}) with the target architecture in docs/unified/ARCHITECTURE.md (module blueprint, dependency rule, non-negotiable invariants). Produce a prioritized plan; implement only after human approval at Verification."

# Typed inputs — https://docs.fabro.sh/workflows/variables
# Available as {{ inputs.module }} in the goal and every node prompt.
[run.inputs]
module = "storyteller"

# Model fallback chain — https://docs.fabro.sh/execution/failures
# codex + gpt-5.4 share ONE usage-limited OpenAI account; when it hits
# `usage_limit_reached`, Fabro falls back to Anthropic (separate metered account
# with credits), auto-selecting the closest model per node by capability/cost.
# openai is listed last so Anthropic-primary nodes (opus Plan) still have a net.
[run.model]
name = "codex"
provider = "openai"
fallbacks = ["anthropic", "openai"]

# Docker sandbox: git-checkpoints the run so PLAN.md / DECISIONS.md show in
# "Files Changed". Clone-based — clones origin/<branch>; commit + push before
# running. Switch back to working-tree runs with id = "local".
[run.environment]
id = "docker"

[environments.local]
provider = "local"

[environments.docker]
provider = "docker"

[environments.docker.image]
# node:22-slim + git; Playwright `install --with-deps` pulls browser OS libs at bootstrap.
dockerfile = "FROM node:22-slim\nRUN apt-get update && apt-get install -y git ca-certificates curl && rm -rf /var/lib/apt/lists/*"

# Browser automation for the UI Screenshot stage — https://docs.fabro.sh/agents/mcp
# Playwright MCP exposes browser_navigate/click/type/snapshot/take_screenshot.
# The `sandbox` transport starts the MCP server inside the sandbox — works best
# in Docker/Daytona (which you're now on). The screenshot stage is best-effort
# and never blocks the run. The agent calls browser_install first in a fresh box.
[run.agent.mcps.playwright]
type = "sandbox"
protocol = "sse"
command = ["npx", "@playwright/mcp@latest", "--port", "3100", "--headless", "--browser", "chromium"]
port = 3100
startup_timeout = "90s"
tool_timeout = "3m"

# Collect screenshots as run artifacts (in addition to auto-scanned test-results/).
[run.artifacts]
include = ["screenshots/**", "SCREENSHOTS.md"]

# Hooks — https://docs.fabro.sh/agents/hooks
[[run.hooks]]
id = "unit-tests-after-implement"
name = "unit-tests-after-implement"
event = "stage_complete"
script = "npm run test:unit"
matcher = "developer"
blocking = true
timeout = "10m"

[[run.hooks]]
id = "e2e-full-after-implement"
name = "e2e-full-after-implement"
event = "stage_complete"
script = "npm run test:e2e full-loop"
matcher = "developer"
blocking = false
timeout = "30m"
