_version = 1

[workflow]
graph = "workflow.fabro"

# Run (module is REQUIRED — pass on every run):
#   fabro run .fabro/workflows/plan/workflow.toml -I module=interior-designer
#   fabro run .fabro/workflows/plan/workflow.toml -I module=storyteller
#   fabro run .fabro/workflows/plan/workflow.toml -I module=chat
[run]
goal = "Clean up and align the {{ inputs.module }} module (src/domains/{{ inputs.module }}) with the target architecture in docs/unified/ARCHITECTURE.md (module blueprint, dependency rule, non-negotiable invariants). Produce a prioritized plan; implement only after human approval at Verification."

[run.inputs]
# No default — always pass `-I module=<domain-folder-name>` (under src/domains/).

[run.model]
name = "codex"
provider = "openai"
fallbacks = ["anthropic", "openai"]

# Agent defaults — skills load from the GLOBAL ~/.fabro/skills (Fabro runs skill
# discovery on the local server, so the sandbox {git_root}/.fabro/skills path is not
# found — symlink once: `ln -s "$PWD/.fabro/skills" ~/.fabro/skills`). full
# permissions so developer can run shell (grep, typecheck) and use_skill w/o prompts.
[run.agent]
permissions = "full"

# Docker sandbox: git-checkpoints PLAN.md / DECISIONS.md for Files Changed diffs.
# Use pre-built node image (cache key includes Node); Dockerfile adds git only.
[run.environment]
id = "plan-docker"

[environments.local]
provider = "local"

[environments.plan-docker]
provider = "docker"

[environments.plan-docker.image]
# Slim image lacks git (Fabro requires git for clone). Full bookworm has git + node + npm.
docker = "node:22-bookworm"

# tsc on this monorepo exceeds Node's default ~2GB old-space heap (OOM in `verify`).
# Give the container headroom and raise the heap for all sandbox commands (verify,
# test hooks, e2e).
[environments.plan-docker.resources]
cpu = 4
memory = "6GB"

[environments.plan-docker.env]
NODE_OPTIONS = "--max-old-space-size=4096"

# Preview URLs (fabro sandbox preview / Preview button) require the Daytona provider —
# local/docker sandboxes cannot serve previews. Run UI increments you want to preview
# with: fabro run … --environment plan-daytona --preserve-sandbox
[environments.plan-daytona]
provider = "daytona"

[environments.plan-daytona.image]
docker = "node:22-bookworm"

[environments.plan-daytona.resources]
cpu = 4
memory = "6GB"

[environments.plan-daytona.env]
NODE_OPTIONS = "--max-old-space-size=4096"

# Playwright MCP is NOT configured at run level — it starts before bootstrap and
# burns ~30s per plan-path stage (npx missing). Screenshot stage uses Playwright
# CLI after npm ci instead (see prompts/screenshot.md).

[run.artifacts]
include = ["screenshots/**", "SCREENSHOTS.md"]

[[run.hooks]]
id = "unit-tests-after-implement"
name = "unit-tests-after-implement"
event = "stage_complete"
script = "npm run test:unit"
matcher = "developer"
blocking = true
timeout = "10m"

[[run.hooks]]
id = "e2e-full-after-implement"
name = "e2e-full-after-implement"
event = "stage_complete"
script = "npm run test:e2e full-loop"
matcher = "developer"
blocking = false
timeout = "30m"
