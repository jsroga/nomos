name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    name: architecture, scoped typecheck/eslint, unit
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check:architecture
      - run: npm run qualitygate:changed
      - run: npm run test:unit
